services:
  survey-nginx:
    container_name: survey-nginx
    image: nginx:1.27.2-alpine
    restart: on-failure
    volumes:
      - './api:/var/www/app'
      - './front/dist:/var/www/react'      # Serve React build
      - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
    ports:
      - "8086:80"
    depends_on:
      - survey-php
      - survey-react

  survey-react:
    container_name: survey-react
    build:
      context: ./front
      dockerfile: Dockerfile
    volumes:
      - './front:/var/www/app'
    ports:
      - "3000:3000"
    depends_on:
      - survey-php
      
  survey-php:
    container_name: survey-php
    build: ./docker/php
    volumes:
      - './api:/var/www/app'
    depends_on:
      - survey-db

  survey-db:
    container_name: survey-db
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: survey
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: